name: Unpack update
on:
  push:
    branches: [security-update]
    paths: ['*.zip']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old files with the zip contents
        run: |
          set -e
          unzip -q ./*.zip -d /tmp/new
          rm -rf /tmp/new/*/.github
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/new/*/. .
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack update"
          git push
