name: Unzip project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find and unzip
        run: |
          Z=$(find . -name "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$Z" ]; then
            echo "No zip file found in the repo. Upload the zip first."
            exit 1
          fi
          echo "Using $Z"
          unzip -q "$Z" -d /tmp/p
          rm "$Z"
          cp -a /tmp/p/*/. .
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Cloudflare version v14"
          git push
