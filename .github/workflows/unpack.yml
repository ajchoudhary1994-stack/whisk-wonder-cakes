name: Unpack update
on:
  push:
    branches: [security-update]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old files with the zip contents
        run: |
          set -e
          ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -1)
          if [ -z "$ZIP" ]; then echo "No zip found, nothing to do"; exit 0; fi
          echo "Using $ZIP"
          cp "$ZIP" /tmp/update.zip
          unzip -q /tmp/update.zip -d /tmp/new
          rm -f "$ZIP"
          rm -rf /tmp/new/*/.github
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/new/*/. .
          test -d site && test -d functions
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack update"
          git push
